{% extends "base.html" %}
{% block title %}Delete{% endblock %}
{% block content %}
<h2>Delete asset?</h2>
<p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Yes, delete</button>
  <a class="btn btn-outline-secondary" href="{% url 'asset-detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
