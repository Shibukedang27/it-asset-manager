{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2>Log in</h2>
    <form method="post" class="card card-body">
      {% csrf_token %}
      {% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input class="form-control" type="text" name="username" id="id_username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" name="password" id="id_password" required>
      </div>
      <button class="btn btn-primary">Log in</button>
      <p class="mt-3 mb-0">No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </form>
  </div>
</div>
{% endblock %}
